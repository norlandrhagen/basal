[project]
name = "basal"
version = "0.0.1"
description = "Icechunk-backed prototype catalog"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CarbonPlan" }]

[project.urls]
Homepage = "https://github.com/norlandrhagen/basal"
Repository = "https://github.com/norlandrhagen/basal"
Documentation = "https://norlandrhagen.github.io/basal"

dependencies = [
    "icechunk>=2.0.3",
    "obstore>=0.9.4",
    "rich>=13.0.0",
    "xarray>=2026.4.0",
    "zarr>=3.1.6",
]

[project.optional-dependencies]
search = ["fastembed>=0.2.0", "duckdb>=1.5.2", "arro3-core>=0.1.0"]
stac = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
docs = ["mkdocs-material>=9.0", "markdown-exec>=1.0"]
dev = [
    "pytest>=8.0.0",
    "ipdb",
    "h5netcdf",
    "netcdf4",
    "pooch",
    "dask",
    "prek>=0.1.0",
    "ruff>=0.4.0",
    "basal[search]",
    "pytest-xdist>=3.8.0",
    "gcsfs>=2026.5.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E/F (Defaults), B (Bugbear), I (Isort), UP (Upgrade)
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]
